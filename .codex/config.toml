# Project defaults for new trusted sessions; explicit session choices win.
# Keep credentials, providers and machine sandbox policy in the user config.
model = "gpt-6-astra"
model_reasoning_effort = "high"
web_search = "live"

# Preserve the operator's existing project setting.
[features]
goals = false

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--context", "codex", "--project-from-cwd", "--enable-web-dashboard", "False", "--open-web-dashboard", "False"]

# External-repository research is opt-in; local source uses Codebase Memory/Serena.
[mcp_servers.deepwiki]
enabled = false

# Artifact capabilities are opt-in for tasks that actually request these outputs.
# This does not uninstall plugins or change workspace-managed connector state.
[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."latex@openai-bundled"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

# Optional reasoning helper; re-enable explicitly for a task that needs it.
[mcp_servers.sequential-thinking]
enabled = false

# App IDs from the installed plugin manifests; these are project-only denials.
# Workspace-managed plugin installation itself is not changed by local settings.
[apps.connector_68df33b1a2d081918778431a9cfca8ba]
enabled = false # Canva

[apps.asdk_app_69d3e5ee6a708191baa733f7b8931995]
enabled = false # Supabase

