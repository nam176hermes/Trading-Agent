[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trading-agent-control-api"
version = "0.1.0"
description = "Read-only contract-first control API for legacy trading-agent data"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.18.5",
  "duckdb==1.5.5",
  "fastapi==0.139.0",
  "polars==1.44.1",
  "psycopg-pool>=3.3.1",
  "psycopg[binary]>=3.3.4",
  "pyarrow>=25.0.0",
  "pydantic==2.13.4",
  "sentry-sdk[fastapi]>=2.68.1",
  "sqlalchemy>=2.0.51",
  "uvicorn==0.51.0",
]

[project.scripts]
trading-agent-nautilus = "packages.nautilus_engine_cli.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "httpx2==2.9.1",
  "hypothesis==6.151.9",
  "pytest==9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/control_api/control_api",
  "apps/control_api/trading_control",
]

[tool.hatch.build.targets.wheel.force-include]
"apps/job_api" = "apps/job_api"
"apps/operator_api" = "apps/operator_api"
"packages" = "packages"
"services" = "services"
"engines/nautilus/runtime_v1/profile.py" = "engines/nautilus/runtime_v1/profile.py"

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]
markers = [
  "host_coupled: opt-in tests that require host capabilities or a populated offline dependency cache",
  "runtime_postgres: opt-in smoke tests for the operator-managed PostgreSQL and reviewed legacy dataset",
]
