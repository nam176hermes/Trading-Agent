name: Host Authority

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, linux, x64, trading-authority]
    environment: trading-authority
    timeout-minutes: 45
    env:
      CI: "true"
      LIVE_EXECUTION_ENABLED: "false"
      LIVE_TRADING_APPROVED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync root Python environment
        run: uv sync --frozen

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci --prefix apps/dashboard

      - name: Sync legacy research environment
        run: uv sync --frozen --extra test --directory legacy/research-backend

      - name: Run host authority qualification
        run: TEST_EVIDENCE_DIR="/tmp/trading-agent-host-authority.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" make ci-host-authority NONINTERACTIVE=1
