name: Foundation

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-${{ github.event_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    env:
      CI: "true"
      LIVE_EXECUTION_ENABLED: "false"
      LIVE_TRADING_APPROVED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync root Python environment
        run: uv sync --frozen

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci --prefix apps/dashboard

      - name: Classify P1-H change impact from base authority
        if: github.event_name == 'pull_request'
        run: set -euo pipefail; base_sha="${{ github.event.pull_request.base.sha }}"; resolved_base="$(git rev-parse --verify "$base_sha^{commit}")"; test "$resolved_base" = "$base_sha"; authority_root="${RUNNER_TEMP:?}/p1-h-base-authority"; if test -e "$authority_root" || test -L "$authority_root"; then exit 2; fi; install -d -m 0700 -- "$authority_root"; test "$(stat -c '%u:%a' -- "$authority_root")" = "$(id -u):700"; git archive "$base_sha" | tar -x -C "$authority_root"; decision_path="$authority_root/decision.json"; if PYTHONPATH="$authority_root" uv run python "$authority_root/scripts/classify_p1_h_impact.py" --repo "$GITHUB_WORKSPACE" --base "$base_sha" --head "$GITHUB_SHA" > "$decision_path"; then cat "$decision_path"; exit 0; fi; status=$?; cat "$decision_path"; test "$status" -eq 2; uv run python -c 'import json,sys; decision=json.load(open(sys.argv[1], encoding="utf-8")); assert decision.get("change_class") == "D"; assert decision.get("disposition") == "HELD"; assert decision.get("reasons") == ["class_d_requires_operator_policy"]' "$decision_path"; test "${{ contains(github.event.pull_request.labels.*.name, 'p1-class-d-approved') }}" = "true"

      - name: Run canonical local and CI gate
        run: make ci-portable NONINTERACTIVE=1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate protected-main HWC portable evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: set -euo pipefail; headless="${RUNNER_TEMP:?}/hwc-portable/${GITHUB_SHA}/hwc-headless-portable-evidence-v1.json"; uv run python scripts/qualify_hwc_headless.py --output "$headless"; uv run python scripts/record_hwc_portable_receipt.py --headless "$headless" --output "${RUNNER_TEMP:?}/hwc-portable/${GITHUB_SHA}/hwc-portable-qualified-v1.json"

      - name: Publish protected-main HWC portable evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hwc-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hwc-portable/${{ github.sha }}/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate protected-main promotion provenance
        id: pre-p3-promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('docs/implementation/pre-p3/receipts/pre-p3-candidate-v2.json') != ''
        run: set -euo pipefail; output="${RUNNER_TEMP:?}/pre-p3-promotion/${GITHUB_SHA}-v1.json"; uv run python scripts/qualify_pre_p3.py promotion-v1 --candidate docs/implementation/pre-p3/receipts/pre-p3-candidate-v2.json --promoted-revision "$GITHUB_SHA" --output "$output" --skip-stale-candidate; if test -f "$output"; then echo 'generated=true' >> "$GITHUB_OUTPUT"; else echo 'generated=false' >> "$GITHUB_OUTPUT"; fi

      - name: Publish protected-main promotion provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pre-p3-promotion.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pre-p3-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-p3-promotion/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish sealed portable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trading-agent-ci-portable-publication.${{ github.run_id }}.${{ github.run_attempt }}/artifact/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  attest-hwc:
    name: attest-hwc-protected-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download protected-main HWC portable evidence
        uses: actions/download-artifact@v4
        with:
          name: hwc-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hwc-attestation

      - name: Attest protected-main HWC portable receipt
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/hwc-attestation/hwc-portable-qualified-v1.json
