name: Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      LIVE_EXECUTION_ENABLED: "false"
      LIVE_TRADING_APPROVED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync root Python environment
        run: uv sync --frozen

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci --prefix apps/dashboard

      - name: Run canonical local and CI gate
        run: make ci-portable NONINTERACTIVE=1

      - name: Publish sealed portable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/state/ci-portable/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
