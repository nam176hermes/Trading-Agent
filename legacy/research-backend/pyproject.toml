[project]
name = "trading-agent-legacy"
version = "0.1.0"
description = "Reproducibility manifest for the Phase 1 legacy trading backend"
requires-python = "==3.11.*"
dependencies = [
  "aiohttp==3.14.3",
  "ccxt==4.5.18",
  "cryptography==50.0.0",
  "lightgbm==4.6.0",
  "numpy==2.4.5",
  "openai==2.37.0",
  "pandas==3.0.3",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
  "torch==2.13.0",
  "websocket-client==1.9.0",
  "yfinance==1.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--capture=sys"]
