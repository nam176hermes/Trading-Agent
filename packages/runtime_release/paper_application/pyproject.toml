[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trading-agent-control-api"
version = "0.1.0"
description = "Read-only contract-first control API for legacy trading-agent data"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.139.0",
  "psycopg-pool>=3.3.1",
  "psycopg[binary]>=3.3.4",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
]

[tool.uv]
constraint-dependencies = [
  "annotated-types==0.7.0",
  "anyio==4.14.1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/job_api",
  "packages/job_contracts",
  "packages/runtime_release",
  "services/job_store",
  "services/job_worker",
  "services/safety_state_exporter",
]

[tool.hatch.build.targets.wheel.force-include]
"packages/safety_evidence.py" = "packages/safety_evidence.py"
